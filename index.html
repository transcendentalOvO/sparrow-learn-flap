<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="description" content="Bird Watch Game 2 clone - 点按叠冰托高小鸟，收集金币，能量满格 Flying!!! 飞入天空。" />
<meta name="theme-color" content="#7ec8ef" />
<title>Bird Watch · Learn to Flap</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1a2a3a;
    -webkit-user-select:none; user-select:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
  #stage { position:relative; }
  canvas { display:block; border-radius:16px; box-shadow:0 24px 70px rgba(8,20,40,.55);
           touch-action:none; user-select:none; -webkit-user-select:none; background:#bfe6fa; }
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<script>
/* ============================================================
   Bird Watch Game 2 clone (v5)
   · 奔跑: 点一下 = 小鸟脚下 +1 冰块, 把小鸟托高
   · 障碍 = 冰崖/冰墙: 高度1~8格, 宽度1~2格
   · 小鸟底低于障碍顶 → 撞上结束; 越过 → 按障碍格数削短冰柱
   · 收集金币, 金币数左上显示, 拾取时飘 +1
   · 能量满格 → "Flying!!!" 障碍炸开, 进入天空飞行
   · 飞行: 点=向上跃起 松手=下坠; 能量尽→软着陆→再跑循环
   ============================================================ */
(function(){
'use strict';
const W=420,H=640;
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let R=2;
function applyRes(){ R=Math.max(1,Math.min(2.5,window.devicePixelRatio||1));
  canvas.width=Math.round(W*R);canvas.height=Math.round(H*R);ctx.setTransform(R,0,0,R,0,0); }
const stage=document.getElementById('stage');
function fit(){ const s=Math.min(window.innerWidth/W,window.innerHeight/H)*0.985;
  canvas.style.width=W+'px';canvas.style.height=H+'px';stage.style.transform='scale('+s+')'; }
window.addEventListener('resize',function(){fit();applyRes();});
window.addEventListener('orientationchange',function(){setTimeout(function(){fit();applyRes();},120);});
fit();applyRes();

const GROUND=560, BX=150, R_B=17, CUBE=38;
const E_MAX=100, E_RUN=17, E_FLY=10;
const RUN_SPD=140, RUN_MAX=235;
const G=840, FLAP=520, FALL_MAX=640;
const STK_MAX=13;
let best=+(localStorage.getItem('lf_best')||0);
let muted=false; if(localStorage.getItem('lf_mute')==='1')muted=true;

let state='menu';
let energy=0, ft=0, stk=0, coins=0;
let birdY=GROUND-R_B, vy=0;
let deadT=0, newBest=false, bannerT=0, flyingN=0, bobT=0;
let obs=[], coinItems=[], floatTexts=[], parts=[], flakes=[], clouds=[], caveShapes=[], landT=0;
let wingT=0;

(function(){ for(let i=0;i<44;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2.4,v:.5+Math.random()*1.8,ph:Math.random()*7});
 for(let i=0;i<4;i++)clouds.push({x:Math.random()*W,y:40+Math.random()*170,s:.7+Math.random()*1.1,v:4+Math.random()*6});
 for(let i=0;i<6;i++)caveShapes.push({x:Math.random()*W,y:Math.random()*H*0.7+50,w:40+Math.random()*80,h:60+Math.random()*120}); })();

function obsCap(){ return Math.min(8, 2+Math.floor(ft/55)); }
function obsWn(){ return 1+(Math.random()<0.25?1:0); }
function topOf(){ return GROUND-stk*CUBE; }
function startObs(){
  obs=[]; coinItems=[]; let x=W+150;
  for(let i=0;i<5;i++){ const w=obsWn(),h=1+Math.floor(Math.random()*obsCap());
    obs.push({x:x,w:w,h:h,passed:false});
    spawnCoins(x,w,h);
    x+= w*CUBE + 130 + h*CUBE*0.55 + Math.random()*120; }
}
let nextH=1+Math.floor(Math.random()*obsCap());
function growObs(){
  const w=obsWn(),h=nextH;
  obs.push({x:W+40,w:w,h:h,passed:false});
  spawnCoins(W+40,w,h);
  nextH=1+Math.floor(Math.random()*obsCap());
}
function spawnCoins(x,w,h){
  const count=1+Math.floor(Math.random()*2);
  for(let i=0;i<count;i++){
    coinItems.push({x:x+w*CUBE*0.5+(Math.random()-.5)*30,y:GROUND-h*CUBE-35-Math.random()*60,r:9,collected:false});
  }
}

/* ---------- 音效 ---------- */
let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f0,f1,dur,type,vol){ if(muted)return; const a=ac(); if(!a)return;
  const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.03);}
function sTap(){tone(520,940,.09,'triangle',.1);} function sCut(){tone(300,140,.13,'square',.07);}
function sFly(){[620,880,1240].forEach(function(f,i){setTimeout(function(){tone(f,f,.16,'triangle',.1);},i*85);});}
function sBoom(){tone(220,60,.28,'sawtooth',.13);} function sCoin(){tone(1200,1600,.12,'sine',.08);}
function sDie(){tone(320,70,.42,'sawtooth',.18);} function sNew(){[660,880,1180,1400].forEach(function(f,i){setTimeout(function(){tone(f,f,.16,'triangle',.1);},i*90);});}

const muteRect={x:W-46,y:10,w:36,h:36};

function startGame(){
  energy=0; ft=0; stk=0; coins=0; vy=0; birdY=GROUND-R_B; deadT=0; newBest=false; bannerT=0; flyingN=0; landT=0;
  startObs(); floatTexts=[]; parts=[]; state='run';
}
function addBlock(){
  if(stk<STK_MAX){ stk++; sTap(); bobT=1;
    for(let i=0;i<7;i++)parts.push({x:BX+(Math.random()-.5)*CUBE,y:topOf()-3,vx:(Math.random()-.5)*90,vy:-40-Math.random()*80,life:.22+Math.random()*.18,t:0,r:1.6+Math.random()*2.2,col:'#e9f9ff'}); }
}
function launch(){
  state='fly'; bannerT=2.3; flyingN++; sFly();
  obs.forEach(function(o){
    for(let k=0;k<12;k++)parts.push({x:o.x+Math.random()*o.w*CUBE,y:GROUND-(o.h-1)*CUBE+Math.random()*o.h*CUBE,
      vx:(Math.random()-.5)*320,vy:-160-Math.random()*240,life:.5+Math.random()*.45,t:0,r:3+Math.random()*4.4,
      col:['#dff3ff','#bfe6ff','#8fd0f5','#ffffff','#eaf6ff'][k%5]});
  });
  sBoom();
  obs=[]; coinItems=[]; vy=-330; burst(BX,birdY,14);
}
function softLand(){ state='land'; vy=0; landT=0; burst(BX,birdY,8); }
function crash(){
  state='over'; deadT=0; sDie(); burst(BX,birdY,22);
  try{ localStorage.setItem('lf_last',String(Math.round(ft)));
    if(ft>best){best=ft;newBest=true;localStorage.setItem('lf_best',String(Math.round(best)));setTimeout(sNew,250);} }catch(e){}
}
function burst(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=50+Math.random()*250;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-70,life:.35+Math.random()*.32,t:0,r:2+Math.random()*3.2,col:Math.random()<.5?'#fff':'#dff3ff'});}}

function tapMain(){
  if(state==='menu'){startGame();return;}
  if(state==='run'){addBlock();return;}
  if(state==='fly'){ if(energy>0){vy=-FLAP;sTap();} return; }
  if(state==='land'){ return; }
  if(state==='over'&&deadT>0.6){startGame();return;}
}
function handleDown(x,y){
  if(x>=muteRect.x&&x<=muteRect.x+muteRect.w&&y>=muteRect.y&&y<=muteRect.y+muteRect.h){muted=!muted;localStorage.setItem('lf_mute',muted?'1':'0');return;}
  tapMain();
}
canvas.addEventListener('pointerdown',function(e){ac();
  const r=canvas.getBoundingClientRect();
  handleDown((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);});
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();ac();tapMain();}});

/* ---------- 逻辑 ---------- */
let last=performance.now(),acc=0; const STEP=1/240;
function tick(dt){
  wingT+=dt*12;
  if(bobT>0)bobT=Math.max(0,bobT-dt*3.2);
  if(state==='run'){
    energy=Math.min(E_MAX,energy+E_RUN*dt);
    const spd=Math.min(RUN_MAX,RUN_SPD+energy*0.5);
    ft+=spd*dt*0.02;
    obs.forEach(function(o){o.x-=spd*dt;});
    coinItems.forEach(function(c){c.x-=spd*dt;});
    if(obs.length&&obs[0].x<-obs[0].w*CUBE-60)obs.shift();
    coinItems=coinItems.filter(function(c){return c.x>-40 && !c.collected;});
    const lp=obs[obs.length-1];
    if(lp&&lp.x+lp.w*CUBE < W-(140+nextH*CUBE*0.6+Math.random()*100))growObs();
    // 收集金币
    for(let i=coinItems.length-1;i>=0;i--){
      const c=coinItems[i];
      const dx=c.x-BX, dy=c.y-birdY;
      if(!c.collected && dx*dx+dy*dy < (R_B+c.r+4)*(R_B+c.r+4)){
        c.collected=true; coins++; sCoin();
        floatTexts.push({x:c.x,y:c.y-10,text:'+1',life:.8,t:0,col:'#ffd700'});
      }
    }
    // 球与障碍块堆
    for(let i=0;i<obs.length;i++){
      const o=obs[i];
      const oTop=GROUND-o.h*CUBE;
      const oL=o.x, oR=o.x+o.w*CUBE;
      const over = BX+R_B>oL && BX-R_B<oR;
      if(over && stk<o.h){ crash(); return; }
      if(!o.passed && oR<BX-R_B){
        o.passed=true;
        const cut=Math.min(stk,o.h);
        if(cut>0){ stk-=cut; sCut();
          for(let k=0;k<12;k++)parts.push({x:BX+(Math.random()-.5)*CUBE,y:GROUND-cut*CUBE+Math.random()*cut*CUBE,
            vx:(Math.random()-.5)*180,vy:-70-Math.random()*140,life:.45,t:0,r:2.4+Math.random()*3,col:'#dff3ff'});
        }
      }
    }
    birdY += ((topOf()-R_B)-birdY)*Math.min(1,dt*16);
    if(energy>=E_MAX){ launch(); }
  } else if(state==='fly'){
    const spd=Math.min(320,RUN_MAX+40+ft*0.06);
    energy=Math.max(0,energy-E_FLY*dt);
    vy=Math.min(FALL_MAX,vy+G*dt);
    birdY+=vy*dt;
    if(birdY-R_B<26){birdY=R_B+26;if(vy<0)vy*=-0.25;}
    ft+=spd*dt*0.02;
    // 彩虹尾迹
    if(Math.random()<0.8){
      const rainbow=['#ff6b6b','#ffd93d','#6bcf7f','#4d96ff','#a66cff'];
      parts.push({x:BX-10,y:birdY+8,vx:-80-Math.random()*60,vy:-10+Math.random()*20,life:.35,t:0,r:2.2+Math.random()*2.2,col:rainbow[Math.floor(Math.random()*rainbow.length)],isTrail:true});
    }
    if(birdY+R_B>=GROUND){ softLand(); return; }
  } else if(state==='land'){
    vy=Math.min(230,vy+G*dt*0.65);
    birdY+=vy*dt;
    landT+=dt;
    if(birdY>=GROUND-R_B){birdY=GROUND-R_B;vy=0;}
    if(landT>0.55){ state='run'; energy=0; stk=0; startObs(); bannerT=0; }
  } else if(state==='menu'){
    birdY+=((GROUND-R_B)-birdY)*Math.min(1,dt*8);
  } else if(state==='over'){ deadT+=dt; }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;}
  for(let i=floatTexts.length-1;i>=0;i--){const f=floatTexts[i];f.t+=dt;if(f.t>f.life){floatTexts.splice(i,1);continue;}f.y-=20*dt;}
  flakes.forEach(function(f){f.y+=f.v*dt*34;f.x+=Math.sin(performance.now()/900+f.ph)*12*dt;if(f.y>H+6){f.y=-6;f.x=Math.random()*W;}});
  clouds.forEach(function(c){c.x-=c.v*dt;if(c.x<-160){c.x=W+60;c.y=40+Math.random()*160;}});
  caveShapes.forEach(function(s){s.x-=40*dt;if(s.x+s.w<0){s.x=W+20+Math.random()*100;s.y=Math.random()*H*0.7+50;}});
  if(bannerT>0)bannerT-=dt;
}
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now;
  acc+=dt; while(acc>=STEP){tick(STEP);acc-=STEP;} draw(); requestAnimationFrame(frame); }

/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function text(s,x,y,size,color,align,bold){ctx.font=(bold?'800 ':'600 ')+size+'px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(s,x,y);}
function oText(s,x,y,size,color,line){ctx.font='800 '+size+'px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size/8);ctx.strokeStyle=line;ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y);}

function sky(flyAmt){
  // 天空随飞行状态从白天雪地过渡到深蓝洞穴
  const g=ctx.createLinearGradient(0,0,0,H);
  if(flyAmt<0.5){
    g.addColorStop(0,interpColor('#aee1fb','#1a2f4a',flyAmt*2));
    g.addColorStop(.55,interpColor('#d8f1fe','#223a5a',flyAmt*2));
    g.addColorStop(1,interpColor('#f4fbff','#2d4566',flyAmt*2));
  } else {
    g.addColorStop(0,'#1a2f4a');
    g.addColorStop(.6,'#223a5a');
    g.addColorStop(1,'#2d4566');
  }
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 太阳/月亮
  // 视频中白天背景没有太阳，保持简洁天空
}
function interpColor(a,b,t){
  const ca=hexToRgb(a), cb=hexToRgb(b);
  const r=Math.round(ca.r+(cb.r-ca.r)*t), g=Math.round(ca.g+(cb.g-ca.g)*t), bl=Math.round(ca.b+(cb.b-ca.b)*t);
  return 'rgb('+r+','+g+','+bl+')';
}
function hexToRgb(h){const n=parseInt(h.slice(1),16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
function cld(flyAmt){
  if(flyAmt>0.3)return;
  clouds.forEach(function(c){ctx.save();ctx.globalAlpha=.9*(1-flyAmt);ctx.translate(c.x,c.y);const s=c.s*16;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,s*.3,s*1.6,s*.6,0,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(-s*.8,0,s*.6,0,7);ctx.fill();ctx.beginPath();ctx.arc(-s*.2,-s*.45,s*.8,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(s*.6,-s*.2,s*.7,0,7);ctx.fill();ctx.restore();});
}
function caveDraw(flyAmt){
  if(flyAmt<0.2)return;
  const a=(flyAmt-0.2)/0.8;
  caveShapes.forEach(function(s){
    ctx.globalAlpha=a*0.35;
    ctx.fillStyle='#0d1b2a';
    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(s.x+s.w,s.y+s.h*0.3);
    ctx.lineTo(s.x+s.w*0.7,s.y+s.h);
    ctx.lineTo(s.x-s.w*0.2,s.y+s.h*0.8);
    ctx.closePath();
    ctx.fill();
  });
  ctx.globalAlpha=1;
}
function flakesD(flyAmt){
  flakes.forEach(function(f){
    ctx.globalAlpha=flyAmt>0.3?0.85:0.65;
    ctx.fillStyle=flyAmt>0.3?'#a8d8ff':'#fff';
    ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill();
  });
  ctx.globalAlpha=1;
}
function ground(flyAmt){
  const g=ctx.createLinearGradient(0,GROUND,0,H);
  g.addColorStop(0,interpColor('#ffffff','#5a7a9a',flyAmt));
  g.addColorStop(.3,interpColor('#eaf6ff','#4a6a8a',flyAmt));
  g.addColorStop(1,interpColor('#b3dcf4','#3a5a7a',flyAmt));
  ctx.fillStyle=g;ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='rgba(150,205,240,.5)';
  for(let x=-6;x<W+8;x+=26){ctx.beginPath();ctx.arc(x,GROUND+3,11,Math.PI,0);ctx.fill();}
  ctx.fillStyle='rgba(120,185,230,.28)';
  for(let x=-6;x<W+8;x+=52)ctx.fillRect(x,GROUND+16,26,3);
}

/* 冰方块(柱子与障碍共用同款块) */
function cube(x,y,size,dark){
  const g=ctx.createLinearGradient(x,y,x+size,y+size);
  if(dark){ g.addColorStop(0,'#a9c7dc');g.addColorStop(.55,'#7fa3c0');g.addColorStop(1,'#5a84a6'); }
  else{ g.addColorStop(0,'#effaff');g.addColorStop(.5,'#cfefff');g.addColorStop(1,'#9cdcfb'); }
  ctx.fillStyle=g; rr(x,y,size,size,4); ctx.fill();
  ctx.strokeStyle=dark?'rgba(40,72,104,.95)':'rgba(110,180,230,.9)'; ctx.lineWidth=2; rr(x,y,size,size,4); ctx.stroke();
  ctx.fillStyle=dark?'rgba(255,255,255,.28)':'rgba(255,255,255,.85)';
  ctx.fillRect(x+5,y+5,size-11,size*.3);
  if(dark){ctx.fillStyle='rgba(20,45,70,.25)';ctx.fillRect(x+size-6,y+size-6,6,6);}
}
function pillar(){ for(let i=0;i<stk;i++)cube(BX-CUBE/2,GROUND-(i+1)*CUBE,CUBE,false); }
function obstacleDraw(){
  obs.forEach(function(o){
    // 冰崖主体
    const x=o.x, w=o.w*CUBE, h=o.h*CUBE;
    const g=ctx.createLinearGradient(x,GROUND-h,x+w,GROUND);
    g.addColorStop(0,'#8fbcd8');g.addColorStop(.5,'#5e93b8');g.addColorStop(1,'#3f7299');
    ctx.fillStyle=g;
    rr(x,GROUND-h,w,h,5);ctx.fill();
    // 冰边
    ctx.strokeStyle='rgba(200,235,255,.8)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x+2,GROUND-h+5);ctx.lineTo(x+2,GROUND-3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+w-2,GROUND-h+5);ctx.lineTo(x+w-2,GROUND-3);ctx.stroke();
    // 顶部积雪
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.moveTo(x,GROUND-h);ctx.lineTo(x+w*0.2,GROUND-h-8);ctx.lineTo(x+w*0.5,GROUND-h-3);ctx.lineTo(x+w*0.8,GROUND-h-10);ctx.lineTo(x+w,GROUND-h);ctx.closePath();ctx.fill();
    // 冰块纹理
    for(let r=0;r<o.h;r++)for(let c=0;c<o.w;c++){
      const cx=x+c*CUBE+4, cy=GROUND-(r+1)*CUBE+4, cs=CUBE-8;
      ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;
      ctx.strokeRect(cx,cy,cs,cs);
    }
  });
}
function coinDraw(){
  coinItems.forEach(function(c){
    if(c.collected)return;
    ctx.save();ctx.translate(c.x,c.y);
    // 外发光
    ctx.shadowColor='rgba(255,215,0,.6)';ctx.shadowBlur=8;
    ctx.fillStyle='#ffd700';
    ctx.beginPath();ctx.arc(0,0,c.r,0,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#ff8c00';ctx.lineWidth=2.5;ctx.stroke();
    // 内部高光
    ctx.fillStyle='#fff5a0';
    ctx.beginPath();ctx.arc(-3,-3,c.r*0.4,0,7);ctx.fill();
    // 金币符号
    ctx.fillStyle='#b8860b';
    ctx.font='700 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('$',0,1);
    ctx.restore();
  });
}
function floatTextDraw(){
  floatTexts.forEach(function(f){
    ctx.globalAlpha=Math.max(0,1-f.t/f.life);
    text(f.text,f.x,f.y,16,f.col,'center',true);
  });
  ctx.globalAlpha=1;
}
function squareBird(cx,cy,isFlying){
  const size=R_B*2.1, half=size/2;
  // 阴影
  ctx.fillStyle='rgba(30,60,90,.16)';
  ctx.beginPath();ctx.ellipse(cx,GROUND-R_B+3,size*0.75,3.4,0,0,7);ctx.fill();

  ctx.save();ctx.translate(cx,cy);
  // 飞行时左右微倾
  const tilt=isFlying?Math.sin(wingT*0.7)*0.12:0;
  ctx.rotate(tilt);

  // 身体颜色：地面紫色，飞行浅蓝白
  const bodyColor=isFlying?'#b8d4f0':'#8b7fd4';
  const g=ctx.createLinearGradient(-half,-half,half,half);
  g.addColorStop(0,bodyColor);g.addColorStop(1,isFlying?'#e8f4ff':'#6b5fb8');
  ctx.fillStyle=g;
  rr(-half,-half,size,size,7);ctx.fill();
  ctx.strokeStyle=isFlying?'#7aa3c8':'#5a4fa0';ctx.lineWidth=2;ctx.stroke();

  // 高光
  ctx.fillStyle='rgba(255,255,255,.35)';
  rr(-half+4,-half+4,size-12,size*0.35,4);ctx.fill();

  // 绿色翅膀
  ctx.fillStyle='#6bcf7f';
  ctx.beginPath();
  const wingY=Math.sin(wingT*(isFlying?3:1))*4;
  ctx.ellipse(half-2,2+wingY,10,6,0.4,0,7);
  ctx.fill();
  ctx.strokeStyle='#4aa85c';ctx.lineWidth=1.5;ctx.stroke();

  // 大眼睛
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(4,-4,8,0,7);ctx.fill();
  ctx.strokeStyle='#444';ctx.lineWidth=1.2;ctx.stroke();
  ctx.fillStyle='#222';
  ctx.beginPath();ctx.arc(6,-4,4,0,7);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(7,-6,2,0,7);ctx.fill();

  // 橙色小嘴
  ctx.fillStyle='#ff9d3c';
  ctx.beginPath();ctx.moveTo(half-2,0);ctx.lineTo(half+10,-4);ctx.lineTo(half+10,5);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#e07b20';ctx.lineWidth=1;ctx.stroke();

  ctx.restore();
}
function partsD(){
  parts.forEach(function(p){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    ctx.fillStyle=p.col;
    if(p.isTrail){
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    } else {
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    }
  });
  ctx.globalAlpha=1;
}

function hud(){ctx.fillStyle='rgba(255,255,255,.75)';rr(muteRect.x,muteRect.y,muteRect.w,muteRect.h,10);ctx.fill();

function draw(){
  const flyAmt=(state==='fly'||state==='land')?1:0;
  ctx.clearRect(0,0,W,H);
  sky(flyAmt);cld(flyAmt);caveDraw(flyAmt);flakesD(flyAmt);
  obstacleDraw();coinDraw();
  partsD();
  if(state!=='menu')pillar();
  const onG=(state==='run'||state==='land'||state==='menu');
  const cy=onG? birdY+(state==='run'?Math.sin(wingT)*1.4+bobT*5:0) : birdY;
  squareBird(BX,cy,state==='fly'||state==='land');
  ground(flyAmt);
  floatTextDraw();
  if(state==='run')hudRun();
  if(state==='fly'||state==='land')hudFly();
  hud();
  if(state==='menu')menu();
  if(state==='over')over();
}

window.__LF={get:function(){var nx=-1,nh=0;
 for(var k=0;k<obs.length;k++){ if(!obs[k].passed&&(nx<0||obs[k].x<nx)){nx=obs[k].x;nh=obs[k].h;} }
 return {state:state,ft:Math.round(ft),energy:Math.round(energy),stk:stk,birdY:Math.round(birdY),
   coins:coins,obs:obs.length,nx:Math.round(nx),nh:nh,best:Math.round(best),flights:flyingN,errs:window.__errs||[]};}};
window.__errs=[];
window.addEventListener('error',function(e){window.__errs.push('ERR:'+e.message);});
window.addEventListener('unhandledrejection',function(e){window.__errs.push('REJ:'+String(e.reason));});

requestAnimationFrame(function(now){last=now;requestAnimationFrame(frame);});
