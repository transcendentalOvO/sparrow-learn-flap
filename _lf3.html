<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="description" content="麻雀学飞 Learn to Flap v3 - 点按=脚下叠冰块托高, 冰柱被障碍按高削短; 能量满障碍炸开自动起飞, 点按跃起躲空。仿 Bird Watch Game。" />
<meta name="theme-color" content="#7ec8ef" />
<title>学飞 · Learn to Flap</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:radial-gradient(120% 100% at 50% 0%, #3b6ea5 0%, #2a5286 100%);
    -webkit-user-select:none; user-select:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
  #stage { position:relative; }
  canvas { display:block; border-radius:16px; box-shadow:0 24px 70px rgba(8,20,40,.55);
           touch-action:none; user-select:none; -webkit-user-select:none; background:#bfe6fa; }
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<script>
window.__fc=null;
window.requestAnimationFrame=function(cb){window.__fc=cb; return 1;};
window.cancelAnimationFrame=function(){};
</script>
<script>
/* ============================================================
   Learn to Flap v3 (仿 Bird Watch Game)
   · 奔跑: 点按=脚下+1冰块托高; 冰柱下部被石柱障碍按高度削短
   · 石柱矮于鸟=越过但被削格(鸟下落); 石柱高于鸟=撞上结束
   · 能量自动攒满 → "Flying!!!" 所有障碍瞬间炸开, 天空任飞
   · 飞行: 点=向上跃起, 松手=下坠; 触地即败; 能量尽自动滑翔降落
   · 鸟=红色圆球; 障碍随机模式, 越飞越快越高
   ============================================================ */
(function(){
'use strict';
const W=420,H=640;
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let R=2;
function applyRes(){ R=Math.max(1,Math.min(2.5,window.devicePixelRatio||1));
  canvas.width=Math.round(W*R);canvas.height=Math.round(H*R);ctx.setTransform(R,0,0,R,0,0); }
const stage=document.getElementById('stage');
function fit(){ const s=Math.min(window.innerWidth/W,window.innerHeight/H)*0.985;
  canvas.style.width=W+'px';canvas.style.height=H+'px';stage.style.transform='scale('+s+')'; }
window.addEventListener('resize',function(){fit();applyRes();});
window.addEventListener('orientationchange',function(){setTimeout(function(){fit();applyRes();},120);});
fit();applyRes();

/* 红色圆球 */
const ball=new Image(); ball.src='avatar_ball.png';

/* ---------- 常量 ---------- */
const GROUND=560, BX=132, R_B=18, BALL=36;      // 冰块边长36(仿视频观感)
const E_MAX=100, E_RUN=19, E_FLY=9;
const RUN_SPD=150, RUN_MAX=215;
const G=820, FLAP=500, FALL_MAX=600;
const STK_MAX=12;
let best=+(localStorage.getItem('lf_best')||0);
let muted=false; if(localStorage.getItem('lf_mute')==='1')muted=true;

/* ---------- 状态 ---------- */
let state='menu';            // menu|run|fly|land|over
let energy=0, ft=0, stk=0, dropT=0;
let birdY=GROUND-R_B, vy=0, blockRise=0;
let deadT=0, newBest=false, bannerT=0, flyingN=0, cleared=0;
let obs=[], parts=[], flakes=[], clouds=[];
let wingT=0, bob=0, tx=0;
(function(){ for(let i=0;i<44;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2.4,v:.5+Math.random()*1.8,ph:Math.random()*7});
 for(let i=0;i<4;i++)clouds.push({x:Math.random()*W,y:40+Math.random()*170,s:.7+Math.random()*1.1,v:4+Math.random()*6}); })();

function topOf(){ return GROUND-stk*BALL; }

/* 难度: 石柱高度范围随距离增大, 每局随机 */
function obsCap(){ return Math.min(9, 2+Math.floor(ft/70)); }
function obsH(){ return 1+Math.floor(Math.random()*obsCap()); }
function obsW(){ return 24+Math.floor(Math.random()*18); }   // 窄~宽随机
function spawnObs(){
  const h=obsH();
  obs.push({x:W+30, w:obsW(), h:h, shaved:false, passed:false});
}
function startObs(){
  obs=[]; let x=W+170;
  for(let i=0;i<4;i++){
    const w=obsW(), h=obsH();
    obs.push({x:x,w:w,h:h,shaved:false,passed:false});
    x+= w + 120 + h*BALL*0.55 + Math.random()*110;
  }
}

/* ---------- 音频 ---------- */
let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f0,f1,dur,type,vol){ if(muted)return; const a=ac(); if(!a)return;
  const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.03);}
function sTap(){tone(500,900,.08,'triangle',.09);} function sShave(){tone(300,150,.12,'square',.06);}
function sFly(){[620,880,1240].forEach(function(f,i){setTimeout(function(){tone(f,f,.15,'triangle',.1);},i*80);});}
function sBoom(){tone(220,60,.25,'sawtooth',.12);}
function sDie(){tone(320,70,.4,'sawtooth',.18);} function sNew(){[660,880,1180,1400].forEach(function(f,i){setTimeout(function(){tone(f,f,.15,'triangle',.1);},i*90);});}

const muteRect={x:W-46,y:10,w:36,h:36};

/* ---------- 控制 ---------- */
function startGame(){
  energy=0; ft=0; stk=0; vy=0; birdY=GROUND-R_B; blockRise=0; dropT=0;
  deadT=0; newBest=false; bannerT=0; flyingN=0; cleared=0;
  startObs(); parts=[]; state='run';
}
function addBlock(){
  if(stk<STK_MAX){ stk++; blockRise=1; sTap();
    for(let i=0;i<6;i++)parts.push({x:BX+(Math.random()-.5)*BALL,y:topOf()-4,vx:(Math.random()-.5)*80,vy:-30-Math.random()*70,life:.25+Math.random()*.2,t:0,r:1.5+Math.random()*2,col:'#dff3ff'}); }
}
function launch(){
  state='fly'; bannerT=2.2; flyingN++; sFly();
  // 所有障碍瞬间炸开
  obs.forEach(function(o){
    for(let k=0;k<10;k++)parts.push({x:o.x+Math.random()*o.w,y:GROUND-o.h*BALL+Math.random()*o.h*BALL,
      vx:(Math.random()-.5)*300,vy:-150-Math.random()*220,life:.5+Math.random()*.4,t:0,r:2+Math.random()*3.4,
      col:['#9fb4c8','#7d93ad','#c3d2e2','#ffffff'][k%4]});
  });
  sBoom();
  obs=[]; vy=-320; burst(BX,birdY,12);
}
function landSoft(){ state='land'; vy=0; burst(BX,birdY,8); }
function crash(){
  state='over'; deadT=0; sDie(); burst(BX,birdY,20);
  try{ localStorage.setItem('lf_last',String(Math.round(ft)));
    if(ft>best){best=ft;newBest=true;localStorage.setItem('lf_best',String(Math.round(best)));setTimeout(sNew,200);} }catch(e){}
}
function burst(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=50+Math.random()*240;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-70,life:.35+Math.random()*.3,t:0,r:2+Math.random()*3,col:Math.random()<.5?'#fff':'#dff3ff'});}}

function tapMain(){
  if(state==='menu'){startGame();return;}
  if(state==='run'){addBlock();return;}
  if(state==='fly'){ if(energy>0){vy=-FLAP;sTap();} return; }   // 能量尽→滑翔, 点按无效
  if(state==='over'&&deadT>0.6){startGame();return;}
}
function handleDown(x,y){
  if(x>=muteRect.x&&x<=muteRect.x+muteRect.w&&y>=muteRect.y&&y<=muteRect.y+muteRect.h){muted=!muted;localStorage.setItem('lf_mute',muted?'1':'0');return;}
  if(state==='over'&&deadT<=0.6)return;
  tapMain();
}
canvas.addEventListener('pointerdown',function(e){ac();
  const r=canvas.getBoundingClientRect();
  handleDown((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);});
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();ac();tapMain();}});

/* ---------- 逻辑 ---------- */
let last=performance.now(),acc=0; const STEP=1/240;
function tick(dt){
  wingT+=dt*12;
  if(state==='run'){
    energy=Math.min(E_MAX,energy+E_RUN*dt);
    const spd=Math.min(RUN_MAX,RUN_SPD+energy*0.45);
    tx+=spd*dt; ft+=spd*dt*0.02;
    bob=Math.sin(performance.now()/130)*2.4;
    // 障碍移动
    obs.forEach(function(o){o.x-=spd*dt;});
    if(obs.length&&obs[0].x<-obs[0].w-60)obs.shift();
    const lp=obs[obs.length-1];
    if(!lp){ spawnObs(); }
    else {
      const nh=obsH();                       // 下一根的高度决定它的间距(给足爬升时间)
      if(lp.x+lp.w < W-(150+nh*BALL*0.6+Math.random()*120)){ spawnObs(); }
    }
    // 球与柱子: 重叠时若冰柱不够高(球底低于柱顶)→撞; 柱子完全越过后按柱高削短冰柱
    for(let i=0;i<obs.length;i++){
      const o=obs[i];
      const oTop=GROUND-o.h*BALL;
      const over = BX+R_B>o.x && BX-R_B<o.x+o.w;
      if(over && stk<o.h){ crash(); return; }        // 柱高于球底 → 撞上
      if(!o.shaved && o.x+o.w<BX-R_B){                // 已越过 → 底部h块被柱挡住, 削短
        o.shaved=true;
        const cut=Math.min(stk,o.h);
        if(cut>0){ stk-=cut; sShave();
          for(let k=0;k<10;k++)parts.push({x:BX+(Math.random()-.5)*BALL,y:GROUND-cut*BALL+Math.random()*cut*BALL,
            vx:(Math.random()-.5)*170,vy:-60-Math.random()*130,life:.45,t:0,r:2+Math.random()*2.6,col:'#dff3ff'});
        }
      }
    }
    // 平滑: 球贴到冰块柱顶
    birdY += ((topOf()-R_B)-birdY)*Math.min(1,dt*14);
    if(energy>=E_MAX){ launch(); }
  } else if(state==='fly'){
    const spd=Math.min(RUN_MAX+70, RUN_MAX+ft*0.05);
    energy=Math.max(0,energy-E_FLY*dt);
    vy=Math.min(FALL_MAX,vy+G*dt);
    birdY+=vy*dt;
    if(birdY-R_B<26){birdY=R_B+26;if(vy<0)vy*=-0.3;}
    tx+=spd*dt; ft+=spd*dt*0.02;
    if(Math.random()<0.4)parts.push({x:BX-8,y:birdY+6,vx:-50-Math.random()*40,vy:-8,life:.25,t:0,r:1.5+Math.random()*1.5,col:'rgba(255,255,255,.75)'});
    if(birdY+R_B>=GROUND){
      if(energy<=0) landSoft(); else { crash(); return; }
    }
  } else if(state==='land'){
    vy=Math.min(240,vy+G*dt*0.7);
    birdY+=vy*dt;
    if(birdY>=GROUND-R_B){birdY=GROUND-R_B;vy=0;energy=0;state='run';startObs();bannerT=0;}
  } else if(state==='menu'){
    bob=Math.sin(performance.now()/330)*3;
    birdY+=((GROUND-R_B)-birdY)*Math.min(1,dt*8);
  } else if(state==='over'){ deadT+=dt; }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt;}
  flakes.forEach(function(f){f.y+=f.v*dt*34;f.x+=Math.sin(performance.now()/900+f.ph)*12*dt;if(f.y>H+6){f.y=-6;f.x=Math.random()*W;}});
  clouds.forEach(function(c){c.x-=c.v*dt;if(c.x<-160){c.x=W+60;c.y=40+Math.random()*160;}});
  if(bannerT>0)bannerT-=dt;
}
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now;
  acc+=dt; while(acc>=STEP){tick(STEP);acc-=STEP;} draw(); requestAnimationFrame(frame); }

/* ---------- 绘制 ---------- */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function text(s,x,y,size,color,align,bold){ctx.font=(bold?'800 ':'600 ')+size+'px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(s,x,y);}
function oText(s,x,y,size,color,line){ctx.font='800 '+size+'px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size/8);ctx.strokeStyle=line;ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y);}

function sky(){const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#aee1fb');g.addColorStop(.55,'#d8f1fe');g.addColorStop(1,'#f2fbff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const s=ctx.createRadialGradient(W*.8,86,6,W*.8,86,110);
  s.addColorStop(0,'rgba(255,252,224,.95)');s.addColorStop(1,'rgba(255,250,220,0)');
  ctx.fillStyle=s;ctx.fillRect(W*.8-110,86-110,220,220);
  ctx.fillStyle='rgba(200,225,248,.8)';ctx.beginPath();ctx.moveTo(0,GROUND);
  for(let x=0;x<=W;x+=14)ctx.lineTo(x,GROUND-60-Math.sin(x*.018+7)*18);
  ctx.lineTo(W,GROUND);ctx.fill();}
function cld(){clouds.forEach(function(c){ctx.save();ctx.globalAlpha=.9;ctx.translate(c.x,c.y);const s=c.s*16;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,s*.3,s*1.6,s*.6,0,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(-s*.8,0,s*.6,0,7);ctx.fill();ctx.beginPath();ctx.arc(-s*.2,-s*.45,s*.8,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(s*.6,-s*.2,s*.7,0,7);ctx.fill();ctx.restore();});}
function flakesD(){flakes.forEach(function(f){ctx.globalAlpha=.7;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill();});ctx.globalAlpha=1;}
function ground(){const g=ctx.createLinearGradient(0,GROUND,0,H);
  g.addColorStop(0,'#ffffff');g.addColorStop(.3,'#eaf6ff');g.addColorStop(1,'#b3dcf4');
  ctx.fillStyle=g;ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='rgba(150,205,240,.5)';
  for(let x=-6;x<W+8;x+=26){ctx.beginPath();ctx.arc(x,GROUND+3,11,Math.PI,0);ctx.fill();}
  ctx.fillStyle='rgba(120,185,230,.3)';const off=-(tx%52);
  for(let x=off;x<W;x+=52)ctx.fillRect(x,GROUND+18,26,3);}

function iceBlock(x,y,size){
  const g=ctx.createLinearGradient(x,y,x+size,y+size);
  g.addColorStop(0,'#e9f9ff');g.addColorStop(.5,'#c3ecff');g.addColorStop(1,'#93d6fa');
  ctx.fillStyle=g;rr(x,y,size,size,5);ctx.fill();
  ctx.strokeStyle='rgba(120,190,235,.95)';ctx.lineWidth=2;rr(x,y,size,size,5);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.8)';rr(x+6,y+6,size-13,size*.26,4);ctx.fill();
}
function pillar(){
  for(let i=0;i<stk;i++)iceBlock(BX-BALL/2,GROUND-(i+1)*BALL,BALL);
}
function obstacleDraw(){
  obs.forEach(function(o){
    const top=GROUND-o.h*BALL;
    const g=ctx.createLinearGradient(o.x,0,o.x+o.w,0);
    g.addColorStop(0,'#8fa5bc');g.addColorStop(.5,'#6d839c');g.addColorStop(1,'#54708e');
    ctx.fillStyle=g;rr(o.x,top,o.w,GROUND-top,4);ctx.fill();
    ctx.strokeStyle='rgba(40,60,85,.8)';ctx.lineWidth=2;rr(o.x,top,o.w,GROUND-top,4);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(o.x+3,top+4,4,GROUND-top-8);
    ctx.fillStyle='#c8d6e4';rr(o.x-2,top,o.w+4,9,4);ctx.fill();
  });
}
function redBall(cx,cy,roll){
  ctx.fillStyle='rgba(30,60,90,.15)';
  ctx.beginPath();ctx.ellipse(cx,cy+R_B+3,R_B*.95,3,0,0,7);ctx.fill();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(roll||0);
  ctx.beginPath();ctx.arc(0,0,R_B*1.13,0,7);
  ctx.fillStyle='rgba(255,255,255,.96)';ctx.fill();
  ctx.lineWidth=Math.max(2,R_B*.1);ctx.strokeStyle='#e5b24a';ctx.stroke();
  if(ball.complete&&ball.naturalWidth>0){
    ctx.save();ctx.beginPath();ctx.arc(0,0,R_B*1.04,0,7);ctx.clip();
    ctx.drawImage(ball,-R_B*1.06,-R_B*1.06,R_B*2.12,R_B*2.12);
    ctx.restore();
  }
  ctx.restore();
}
function partsD(){parts.forEach(function(p){ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();});ctx.globalAlpha=1;}

function hudRun(){
  ctx.fillStyle='rgba(255,255,255,.82)';
  rr(W-150,12,136,74,14);ctx.fill();
  ctx.strokeStyle='rgba(90,140,190,.35)';ctx.lineWidth=1.5;rr(W-150,12,136,74,14);ctx.stroke();
  text('speed: '+(400+Math.round(energy*2)).toString().padStart(3,' '),W-82,33,15,'#2f6690','center',true);
  const bw=104,bx0=W-144,by0=50;
  ctx.fillStyle='rgba(47,102,144,.15)';rr(bx0,by0,bw,10,5);ctx.fill();
  ctx.fillStyle='#6fc2f0';rr(bx0,by0,bw*energy/100,10,5);ctx.fill();
  ctx.fillStyle='rgba(47,102,144,.7)';ctx.font='600 11px "PingFang SC",sans-serif';ctx.textAlign='center';
  ctx.fillText('满格 → 障碍炸开起飞!',W-82,by0+24);
  oText(String(Math.round(ft))+' ft',W/2-52,40,26,'#2f6690','#fff');
}
function hudFly(){
  if(energy>0){
    if(bannerT>0){ctx.globalAlpha=Math.min(1,bannerT);oText('Flying!!!',W/2,86,40,'#d96c3f','#fff');ctx.globalAlpha=1;}
    else text('Flying!!!',W/2,100,15,'rgba(217,108,63,.85)','center',true);
  } else text('能量耗尽 · 滑翔降落',W/2,100,15,'rgba(47,102,144,.75)','center',true);
  oText(String(Math.round(ft))+' ft',W/2,40,26,'#2f6690','#fff');
  const bw=90,bx0=W/2-bw/2,by0=64;
  ctx.fillStyle='rgba(47,102,144,.15)';rr(bx0,by0,bw,8,4);ctx.fill();
  ctx.fillStyle='#f6a05c';rr(bx0,by0,bw*energy/100,8,4);ctx.fill();
}
function hud(){ctx.fillStyle='rgba(255,255,255,.75)';rr(muteRect.x,muteRect.y,muteRect.w,muteRect.h,10);ctx.fill();
  ctx.fillStyle='#2f6690';ctx.font='600 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(muted?'🔇':'🔊',muteRect.x+muteRect.w/2,muteRect.y+muteRect.h/2+1);}
function menu(){
  ctx.fillStyle='rgba(255,255,255,.95)';rr(W/2-168,22,336,500,28);ctx.fill();
  ctx.strokeStyle='rgba(90,150,200,.4)';ctx.lineWidth=2.5;rr(W/2-168,22,336,500,28);ctx.stroke();
  redBall(W/2,96,0);
  text('学飞 · Learn to Flap',W/2,160,34,'#2f6690','center',true);
  text('灵感来自 Bird Watch Game',W/2,188,12,'rgba(47,102,144,.65)');
  ctx.textAlign='center';
  ctx.font='700 15.5px "PingFang SC",sans-serif';ctx.fillStyle='#2f6690';
  ctx.fillText('点一下 = 脚下叠一块冰, 把球托高',W/2,226);
  ctx.font='600 13.5px "PingFang SC",sans-serif';ctx.fillStyle='rgba(47,102,144,.8)';
  ctx.fillText('冰柱碰到石柱, 会被按柱高削短(球下落)',W/2,252);
  ctx.font='700 15.5px "PingFang SC",sans-serif';ctx.fillStyle='#d96c3f';
  ctx.fillText('球低于柱顶 → 撞上结束',W/2,282);
  ctx.font='700 15px "PingFang SC",sans-serif';ctx.fillStyle='#2f6690';

function over(){

  ctx.fillStyle='rgba(20,45,75,.45)';ctx.fillRect(0,0,W,H);
  const ny=newBest?34:0;
  ctx.fillStyle='rgba(255,255,255,.96)';
  rr(W/2-150,150,300,newBest?280:246,26);ctx.fill();
  ctx.strokeStyle='rgba(240,160,90,.8)';ctx.lineWidth=2.5;rr(W/2-150,150,300,newBest?280:246,26);ctx.stroke();
  if(newBest){ctx.fillStyle='#f6c15c';rr(W/2-84,164,168,30,15);ctx.fill();text('★ 新纪录! ★',W/2,179,'#7a4a00',undefined,true);}
  text('撞到石柱啦',W/2,196+ny,32,'#2f6690',undefined,true);

function draw(){
  ctx.clearRect(0,0,W,H);
  sky();cld();flakesD();
  obstacleDraw();
  partsD();
  if(state!=='menu'){ pillar(); }
  // 球
  const onG=(state==='run'||state==='land'||state==='menu');
  const cy=onG? birdY+bob : birdY;
  const roll= state==='fly'? wingT*.12 : 0;
  redBall(BX,cy,roll);
  ground();
  if(state==='run')hudRun();
  if(state==='fly'||state==='land')hudFly();
  hud();
  if(state==='menu')menu();
  if(state==='over')over();
}

/* ---------- 自测钩子 ---------- */
window.__LF={get:function(){var nx=-1,nh=0;
 for(var k=0;k<obs.length;k++){ if(obs[k].x+obs[k].w>BX-10&&(nx<0||obs[k].x<nx)){nx=obs[k].x;nh=obs[k].h;} }
 return {state:state,ft:Math.round(ft),energy:Math.round(energy),stk:stk,birdY:Math.round(birdY),
   obs:obs.length,nx:Math.round(nx),nh:nh,best:Math.round(best),flights:flyingN,errs:window.__errs||[]};}};
window.__errs=[];
window.addEventListener('error',function(e){window.__errs.push('ERR:'+e.message);});
window.addEventListener('unhandledrejection',function(e){window.__errs.push('REJ:'+String(e.reason));});

requestAnimationFrame(function(now){last=now;requestAnimationFrame(frame);});
})();
</script>
<script>
setTimeout(function(){
  var cv=document.getElementById('game');
  var tl=function(lx,ly){ var r=cv.getBoundingClientRect();
    cv.dispatchEvent(new PointerEvent('pointerdown',{clientX:r.left+lx*r.width/420,clientY:r.top+ly*r.height/640,bubbles:true})); };
  var S=function(){ return window.__LF.get(); };
  var drive=function(){ try{ if(window.__fc){ var f=window.__fc; window.__fc=null; f(performance.now()); } }catch(e){ window.__errs.push('DRIVE:'+e.message); } };
  tl(210,420);
  var log=[], taps=0, shaved=0, flySeen=0, maxStk=0, minStkSurvive=99;
  var lastLog=0;
  var iv=setInterval(function(){
    drive(); var now=performance.now(); var g=S();
    if(now>700 && now<26000){
      if(g.state==='run'){ var need=(g.nh||0); if(g.stk<need && g.stk<12){ tl(210,300); taps++; } }
      if(g.state==='fly'){ if(g.birdY>400){ tl(210,300); taps++; } }
    }
    if(g.stk>maxStk)maxStk=g.stk;
    if(g.state==='fly')flySeen++;
    if(now-lastLog>1500){ lastLog=now;
      log.push('t'+Math.round(now/1000)+' '+g.state+' E'+g.energy+' ft'+g.ft+' stk'+g.stk+' nh'+(g.nh||0)+' nx'+(g.nx||-1)+' y'+g.birdY); }
    if(now>29000){ clearInterval(iv);
      var f2=S();
      var res={final:f2.state,ft:f2.ft,best:Math.round(f2.best),flights:f2.flights,flySeen:flySeen,taps:taps,maxStk:maxStk,
        log:log,errs:window.__errs};
      document.title='LF3TEST:'+JSON.stringify(res); }
  },40);
},400);
</script>
